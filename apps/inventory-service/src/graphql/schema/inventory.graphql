extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.6"
    import: ["@key", "@shareable"]
  )

type Query {
  inventoryHealth: String! @shareable
}

type Mutation {
  createInventoryUser(input: CreateInventoryUserInput!): InventoryUser!
}

input CreateInventoryUserInput {
  name: String!
  email: String!
}

type InventoryUser @key(fields: "id") {
  id: ID!
  name: String!
  email: String!
}
